# Builds the Docker images and publishes them to Docker Hub.
#
# One Docker Hub repository, <you>/pix-ku-csc, holds both images, told apart
# by tag — so this works on a free Docker Hub plan even if the repository is
# made private (a free plan allows one private repository):
#
#   <you>/pix-ku-csc:<tag>             the website   (Dockerfile target: runner)
#   <you>/pix-ku-csc:<tag>-migrator    migrations    (Dockerfile target: migrator)
#
# When it runs:
#   push to master        -> publishes :master and :sha-<short>   (+ -migrator)
#   push a tag v1.2.3     -> publishes :1.2.3, :1.2 and :latest   (+ -migrator)
#   pull request          -> builds only, publishes nothing (proves it still builds)
#   by hand               -> Actions tab -> "Docker image" -> Run workflow
#
# One-time set-up on GitHub (repository -> Settings -> Secrets and variables
# -> Actions):
#   Variables tab:  DOCKER_HUB_USERNAME = your Docker Hub user name
#   Secrets tab:    DOCKER_HUB_TOKEN    = a Docker Hub personal access token
#                                        with Read & Write permission
#                                        (Docker Hub -> Account settings ->
#                                        Personal access tokens)
#
# The images hold no keys or passwords (see .dockerignore and DEPLOY.md);
# everything secret is given to the container when it starts.

name: Docker image

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/${{ vars.DOCKER_HUB_USERNAME }}/pix-ku-csc

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runner
            suffix: ""
          - target: migrator
            suffix: "-migrator"

    steps:
      - name: Check the Docker Hub settings exist
        if: github.event_name != 'pull_request'
        env:
          USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          TOKEN_SET: ${{ secrets.DOCKER_HUB_TOKEN != '' }}
        run: |
          if [ -z "$USERNAME" ]; then
            echo "::error::Add a repository variable DOCKER_HUB_USERNAME (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::Add a repository secret DOCKER_HUB_TOKEN (Settings -> Secrets and variables -> Actions -> Secrets)."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # A pull request has no Docker Hub name to hand if the variable is
          # missing; it only builds, so any name will do.
          images: ${{ vars.DOCKER_HUB_USERNAME != '' && env.IMAGE || 'pix-ku-csc' }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache per target, so the two jobs do not overwrite each other's.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
